// Desenho
// ----------------------------------------------------------------------------
const PAUSE_RECT = new Rect(VW / 2 - 7, 4, 14, 14);

function draw_room(room, rooms) {
  frect(ACTIVE_STAGE.bg, 0, 0, VW, VH);
  frect(room.floor_color, ROOM.x, ROOM.y, ROOM.w, ROOM.h);

  const speck = mix(room.floor_color, [255, 255, 255], 0.06);
  for (let y = ROOM.top + 8; y < ROOM.bottom - 4; y += 16)
    for (let x = ROOM.left + 8; x < ROOM.right - 4; x += 16)
      if ((Math.floor(x / 16) + Math.floor(y / 16)) % 3 === 0) frect(speck, x, y, 2, 2);

  const edge = { devil: COLORS.devil_edge, angel: COLORS.angel_edge, shop: COLORS.shop_edge }[room.role] || ACTIVE_STAGE.edge;
  orect(edge, ROOM.x, ROOM.y, ROOM.w, ROOM.h, 3);
  const inner = ROOM.inflate(-6, -6);
  orect(COLORS.wall, inner.x, inner.y, inner.w, inner.h, 2);

  for (const rock of room.rocks) {
    frect(ACTIVE_STAGE.rock_dark, rock.x, rock.y + 2, rock.w, rock.h);
    frect(ACTIVE_STAGE.rock, rock.x, rock.y, rock.w, rock.h);
    frect(ACTIVE_STAGE.rock_light, rock.x + 2, rock.y + 2, rock.w - 6, 3);
  }

  for (const [direction, target_pos] of Object.entries(room.neighbors)) {
    const rect = door_trigger(direction);
    if (!room.cleared) {
      frect(COLORS.door_closed, rect.x, rect.y, rect.w, rect.h);
      if (direction === "N" || direction === "S") {
        for (let bx = rect.left + 3; bx < rect.right - 2; bx += 6) frect(COLORS.door_bar, bx, rect.top, 2, rect.h);
      } else {
        for (let by = rect.top + 3; by < rect.bottom - 2; by += 6) frect(COLORS.door_bar, rect.left, by, rect.w, 2);
      }
    } else if (rooms.get(target_pos).locked) {
      frect(COLORS.door_locked, rect.x, rect.y, rect.w, rect.h);
      frect(COLORS.panel, rect.centerx - 2, rect.centery - 2, 4, 4);
    } else {
      const target_role = rooms.get(target_pos).role;
      const special = { devil: COLORS.door_devil, angel: COLORS.door_angel, shop: COLORS.door_shop }[target_role];
      if (special) {
        frect(special, rect.x, rect.y, rect.w, rect.h);
        frect(COLORS.panel, rect.x + 3, rect.y + 3, rect.w - 6, rect.h - 6);
      } else frect(COLORS.door_open, rect.x, rect.y, rect.w, rect.h);
      if (room.secret_doors.has(direction)) orect(COLORS.secret_edge, rect.x, rect.y, rect.w, rect.h, 1);
    }
  }

  if (room.hatch) {
    const h = room.hatch;
    frect(COLORS.rock_dark, h.x - 2, h.y - 2, h.w + 4, h.h + 4);
    frect(COLORS.panel, h.x, h.y, h.w, h.h);
    for (let i = 0; i < 4; i++) frect(COLORS.rock_light, h.x + 2 + i, h.y + 2 + i * 4, h.w - 4 - i * 2, 2);
  }
}

function draw_hud(game) {
  const player = game.player, room = game.room;
  T("VIDA", F_SMALL, COLORS.white, ROOM.left + 3, 6);
  for (let i = 0; i < Math.floor(player.max_hp / 2); i++) {
    const x = ROOM.left + 31 + i * 13;
    const full = player.hp >= (i + 1) * 2;
    const half = player.hp === i * 2 + 1;
    frect(full ? COLORS.red : COLORS.dark_red, x, 7, 10, 8);
    if (half) frect(COLORS.red, x, 7, 5, 8);
    if (full || half) frect(COLORS.white, x + 2, 8, 2, 2);
  }
  draw_key_icon(148, 6);
  T("x" + player.keys, F_SMALL, COLORS.white, 161, 6);
  draw_bomb_icon(184, 5);
  T("x" + player.bombs, F_SMALL, COLORS.white, 196, 6);

  draw_coin_icon(ROOM.left + 3, 15);
  T("x" + player.coins, F_SMALL, COLORS.gold, ROOM.left + 15, 16);

  frect(COLORS.panel, PAUSE_RECT.x, PAUSE_RECT.y, PAUSE_RECT.w, PAUSE_RECT.h);
  orect(COLORS.wall_edge, PAUSE_RECT.x, PAUSE_RECT.y, PAUSE_RECT.w, PAUSE_RECT.h, 1);
  frect(COLORS.white, PAUSE_RECT.x + 4, PAUSE_RECT.y + 3, 2, 8);
  frect(COLORS.white, PAUSE_RECT.x + 8, PAUSE_RECT.y + 3, 2, 8);

  T("ANDAR " + game.floor, F_SMALL, COLORS.grey, 262, 6);
  T(ACTIVE_STAGE.name, F_SMALL, COLORS.dim, 262, 15);

  if (room.cleared) T("PORTAS ABERTAS", F_SMALL, COLORS.gold, ROOM.right - 3, 6, "tr");
  else T("INIMIGOS: " + room.enemies.length, F_SMALL, COLORS.white, ROOM.right - 3, 6, "tr");

  if (player.active) {
    const data = ITEMS[player.active];
    const ready = player.active_charge >= data.charges;
    const ix = ROOM.left + 3, iy = 299;
    frect(ready ? COLORS.gold : COLORS.panel, ix - 1, iy - 1, 14, 14);
    frect(ready ? data.color : mix(data.color, COLORS.panel, 0.65), ix, iy, 12, 12);
    T(data.glyph, F_SMALL, COLORS.panel, ix + 6, iy + 6, "c");
    for (let i = 0; i < data.charges; i++)
      frect(i < player.active_charge ? COLORS.gold : COLORS.dark_red, ROOM.left + 19 + i * 6, 308, 4, 4);
    T("Q", F_SMALL, ready ? COLORS.white : COLORS.grey, ROOM.left + 19, 298);
  }

  for (const enemy of room.enemies) {
    if (enemy.is_boss) {
      T(enemy.name, F_SMALL, COLORS.white, ROOM.left + 62, 305);
      frect(COLORS.dark_red, 195, 306, 150, 6);
      frect(COLORS.red, 195, 306, Math.trunc(150 * Math.max(0, enemy.health) / enemy.max_health), 6);
      orect(COLORS.wall_edge, 195, 306, 150, 6, 1);
      break;
    }
  }

  player.items.slice(0, 14).forEach((item_id, i) => frect(ITEMS[item_id].color, ROOM.right - 7 * (i + 1), 306, 5, 5));
}

function draw_minimap(game) {
  const x0 = ROOM.right - 53, y0 = ROOM.top + 3;
  falpha(COLORS.panel, 150 / 255, x0 - 1, y0 - 1, 51, 37);

  let seen = new Set();
  for (const [pos, room] of game.rooms) {
    if (room.visited) { seen.add(pos); for (const n of Object.values(room.neighbors)) seen.add(n); }
  }
  if (game.player.map_reveal) seen = new Set(game.rooms.keys());

  const marker_colors = { boss: COLORS.red, treasure: COLORS.gold, secret: COLORS.secret_edge,
    super: [255, 120, 200], devil: [235, 40, 55], angel: [190, 225, 255], shop: [90, 220, 110] };
  for (const pos of seen) {
    const room = game.rooms.get(pos);
    const [px, py] = P(pos);
    const rx = x0 + (px + 3) * 7, ry = y0 + (py + 3) * 5;
    let color;
    if (pos === game.room.position) color = COLORS.white;
    else if (room.visited) color = COLORS.grey;
    else if (room.role === "secret") color = [80, 50, 110];
    else if (room.role === "super") color = [110, 50, 90];
    else color = COLORS.dim;
    frect(color, rx, ry, 6, 4);
    const marker = marker_colors[room.role];
    if (marker) frect(marker, rx + 2, ry + 1, 2, 2);
  }
}

const STATS_PANEL_W = 98;
const WEAPON_NAMES = { tear: "LAGRIMA", brimstone: "BRIMSTONE", techx: "TECH X" };
const FX_NAMES = { fire: "FOGO", ice: "GELO", poison: "VENENO", pierce: "PERFURANTE", homing: "TELEGUIADO", bounce: "SALTITANTE" };

function stats_tab_rect(is_open) { return new Rect(is_open ? STATS_PANEL_W : 0, 130, 11, 46); }

function fire_rate(player) {
  if (player.weapon === "brimstone" || player.weapon === "techx") return 60 / (player.brim_need + 24);
  return 60 / Math.max(1, player.cooldown);
}

function draw_stats_panel(game, is_open) {
  const p = game.player;
  const tab = stats_tab_rect(is_open);
  if (is_open) {
    const top = 22, height = 296;
    falpha(COLORS.panel, 225 / 255, 0, top, STATS_PANEL_W, height);
    orect(COLORS.wall_edge, 0, top, STATS_PANEL_W, height, 1);

    let y = top + 5;
    T("STATUS", F_SMALL, COLORS.gold, STATS_PANEL_W / 2, y, "tc");
    y += 11;
    line(COLORS.wall_edge, [4, y + 0.5], [STATS_PANEL_W - 5, y + 0.5]);
    y += 4;

    const damage = p.damage * p.damage_mult;
    const rows = [
      ["VIDA", `${p.hp / 2}/${p.max_hp / 2}`, COLORS.red],
      ["DANO", damage.toFixed(1), p.fury > 0 ? [255, 140, 70] : COLORS.white],
      ["CADENCIA", fire_rate(p).toFixed(1) + "/s", COLORS.white],
      ["ALCANCE", (p.tear_life * p.tear_speed / 80).toFixed(1), COLORS.white],
      ["VEL. TIRO", (p.tear_speed / TEAR_SPEED).toFixed(2), COLORS.white],
      ["VELOCIDADE", (p.speed / PLAYER_SPEED).toFixed(2), COLORS.white],
      ["TIROS", String(p.shots), COLORS.white],
      ["INVULN.", (p.invuln_frames / 60).toFixed(1) + "s", COLORS.white],
      ["BOMBA", String(p.bomb_damage), COLORS.white],
      ["MOEDAS", String(p.coins), COLORS.gold],
      ["ARMA", WEAPON_NAMES[p.weapon] || p.weapon.toUpperCase(), COLORS.gold],
    ];
    for (const [label, value, color] of rows) {
      T(label, F_SMALL, COLORS.grey, 5, y);
      T(value, F_SMALL, color, STATS_PANEL_W - 5, y, "tr");
      y += 10;
    }

    y += 3;
    T("EFEITOS", F_SMALL, COLORS.grey, 5, y); y += 10;
    const effects = Object.keys(FX_NAMES).filter(f => p.tear_fx.has(f));
    if (!effects.length) { T("-", F_SMALL, COLORS.dim, 9, y); y += 10; }
    for (const fx of effects) { T(FX_NAMES[fx], F_SMALL, FX_COLORS[fx], 9, y); y += 10; }

    y += 3;
    T("ATIVO", F_SMALL, COLORS.grey, 5, y); y += 10;
    if (p.active) {
      const data = ITEMS[p.active];
      T(data.name, F_SMALL, data.color, 9, y); y += 10;
      T(`cargas ${p.active_charge}/${data.charges}`, F_SMALL, COLORS.white, 9, y); y += 10;
    } else { T("-", F_SMALL, COLORS.dim, 9, y); y += 10; }

    y += 3;
    T(`ITENS (${p.items.length})`, F_SMALL, COLORS.grey, 5, y); y += 11;
    p.items.slice(0, 21).forEach((item_id, i) => {
      const rx = 5 + (i % 7) * 13, ry = y + Math.floor(i / 7) * 13;
      frect(ITEMS[item_id].color, rx, ry, 11, 11);
      T(ITEMS[item_id].glyph, F_SMALL, COLORS.panel, rx + 5.5, ry + 5.5, "c");
    });
  }

  frect(COLORS.panel, tab.x, tab.y, tab.w, tab.h);
  orect(COLORS.wall_edge, tab.x, tab.y, tab.w, tab.h, 1);
  g.save();
  g.translate(tab.centerx, tab.centery);
  g.rotate(-Math.PI / 2);
  T("STATUS", F_SMALL, COLORS.gold, 0, 0, "c");
  g.restore();
}

function draw_banner(banner) {
  const [title, sub] = banner;
  const tW = tw(title, F_HINT), sW = sub ? tw(sub, F_SMALL) : 0;
  const w = Math.max(tW, sW) + 14, h = sub ? 24 : 16;
  falpha(COLORS.panel, 190 / 255, VW / 2 - w / 2, ROOM.top + 8, w, h);
  T(title, F_HINT, COLORS.gold, VW / 2, ROOM.top + 10, "tc");
  if (sub) T(sub, F_SMALL, COLORS.white, VW / 2, ROOM.top + 22, "tc");
}

function draw_game_over(game) {
  falpha(COLORS.panel, 190 / 255, 0, 0, VW, VH);
  T("VOCE MORREU", F_BIG, COLORS.white, VW / 2, VH / 2 - 20, "c");
  T(`Voce chegou ao andar ${game.floor}`, F_HINT, COLORS.grey, VW / 2, VH / 2 + 4, "c");
  T("Segure R por 1 segundo para tentar novamente", F_HINT, COLORS.gold, VW / 2, VH / 2 + 22, "c");
}

function pause_menu_buttons() {
  const cx = VW / 2;
  return [["CONTINUAR", "resume"], ["REINICIAR", "restart"], ["SAIR", "quit"]]
    .map(([label, action], i) => [label, new Rect(cx - 55, 120 + i * 24, 110, 18), action]);
}

function draw_pause(mouse) {
  falpha(COLORS.panel, 200 / 255, 0, 0, VW, VH);
  T("PAUSADO", F_BIG, COLORS.white, VW / 2, 95, "c");
  for (const [label, rect, _a] of pause_menu_buttons()) {
    const hover = rect.collidepoint(mouse[0], mouse[1]);
    frect(hover ? COLORS.wall_edge : COLORS.panel, rect.x, rect.y, rect.w, rect.h);
    orect(COLORS.wall_edge, rect.x, rect.y, rect.w, rect.h, 1);
    T(label, F_HINT, hover ? COLORS.gold : COLORS.white, rect.centerx, rect.centery, "c");
  }
  T("P / ESC: continuar    Segure R: reiniciar", F_SMALL, COLORS.grey, VW / 2, 205, "c");
}

function draw_restart_bar(progress) {
  const w = 120, h = 8, x = VW / 2 - w / 2, y = VH / 2 + 48;
  T("REINICIANDO...", F_SMALL, COLORS.white, VW / 2, y - 8, "c");
  frect(COLORS.panel, x - 1, y - 1, w + 2, h + 2);
  frect(COLORS.gold, x, y, Math.trunc(w * clamp(progress, 0, 1)), h);
  orect(COLORS.wall_edge, x - 1, y - 1, w + 2, h + 2, 1);
}

function render(game, paused, mouse, restart_progress, stats_open) {
  g = ctx0;
  g.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  g.imageSmoothingEnabled = false;
  const room = game.room;
  draw_room(room, game.rooms);

  for (const c of room.chests) c.draw();
  for (const pk of room.pickups) pk.draw();
  for (const it of room.items) it.draw();
  for (const b of game.bombs) b.draw();
  for (const t of game.tears) t.draw();
  for (const r of game.rings) r.draw();
  for (const e of room.enemies.slice().sort((a, b) => (a.flying ? 1 : 0) - (b.flying ? 1 : 0))) e.draw();
  for (const b of game.bullets) b.draw();
  for (const l of game.lasers) l.draw();
  game.player.draw();
  for (const ex of game.explosions) ex.draw();

  draw_hud(game);
  draw_minimap(game);
  draw_stats_panel(game, stats_open);
  if (game.banner) draw_banner(game.banner);

  if (game.game_over) draw_game_over(game);
  else if (paused) draw_pause(mouse);

  if (restart_progress !== null) draw_restart_bar(restart_progress);
}

// ----------------------------------------------------------------------------
// Loop principal
// ----------------------------------------------------------------------------
let game = new Game();
let paused = false, stats_open = false;
let r_since = null, r_locked = false;
let mouse = [0, 0];
const keys = {};
const BLOCKED = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Tab"]);

function toVirtual(ev) {
  const r = canvas.getBoundingClientRect();
  return [(ev.clientX - r.left) / r.width * VW, (ev.clientY - r.top) / r.height * VH];
}

window.addEventListener("keydown", (ev) => {
  if (BLOCKED.has(ev.code)) ev.preventDefault();
  if (ev.repeat) { keys[ev.code] = true; return; }
  keys[ev.code] = true;
  const code = ev.code;
  if (code === "Escape" || code === "KeyP") {
    if (!game.game_over) paused = !paused;
  } else if (code === "Tab") {
    stats_open = !stats_open;
  } else if (code === "KeyE" || code === "Space") {
    if (!paused && !game.game_over) game.place_bomb();
  } else if (code === "KeyQ" || code === "ShiftLeft" || code === "ShiftRight") {
    if (!paused && !game.game_over) game.use_active();
  }
});
window.addEventListener("keyup", (ev) => { keys[ev.code] = false; });
window.addEventListener("blur", () => { for (const k of Object.keys(keys)) keys[k] = false; });

canvas.addEventListener("mousemove", (ev) => { mouse = toVirtual(ev); });
canvas.addEventListener("mousedown", (ev) => {
  canvas.focus();
  if (ev.button !== 0) return;
  const click = toVirtual(ev);
  mouse = click;
  if (stats_tab_rect(stats_open).collidepoint(click[0], click[1])) stats_open = !stats_open;
  else if (!game.game_over && PAUSE_RECT.collidepoint(click[0], click[1])) paused = !paused;
  else if (paused) {
    for (const [_l, rect, action] of pause_menu_buttons()) {
      if (rect.collidepoint(click[0], click[1])) {
        if (action === "resume") paused = false;
        else if (action === "restart") { game = new Game(); paused = false; }
        else { paused = false; game = new Game(); }   // "SAIR": no navegador, volta ao inicio
      }
    }
  }
});

let last = performance.now(), acc = 0;
const STEP = 1000 / FPS;

function frame(now) {
  acc += Math.min(100, now - last);
  last = now;

  let restart_progress = null;
  if (keys.KeyR) {
    if (!r_locked) {
      if (r_since === null) r_since = now;
      const held = now - r_since;
      restart_progress = held / RESTART_HOLD_MS;
      if (held >= RESTART_HOLD_MS) {
        game = new Game(); paused = false; r_since = null; r_locked = true; restart_progress = null;
      }
    }
  } else { r_since = null; r_locked = false; }

  while (acc >= STEP) {
    if (!paused && !game.game_over) game.update(keys);
    acc -= STEP;
  }
  render(game, paused, mouse, restart_progress, stats_open);
  requestAnimationFrame(frame);
}
canvas.focus();
requestAnimationFrame(frame);
</script>
